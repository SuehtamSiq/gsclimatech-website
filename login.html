<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Entrar | GS ClimaTech</title>
</head>
<body class="login-page">
    <div class="login-backdrop" aria-hidden="true"></div>

    <main class="login-container">
        <a href="index.html" class="logo login-logo">GS ClimaTech</a>

        <form id="login-form" class="login-card" novalidate>
            <h1>Entrar</h1>
            <p class="login-subtitle">Acesse o painel da sua conta.</p>

            <label for="login-email">E-mail</label>
            <input type="email" id="login-email" name="email" autocomplete="email" required>

            <label for="login-password">Senha</label>
            <input type="password" id="login-password" name="password" autocomplete="current-password" required>

            <p id="login-error" class="login-error" role="alert"></p>

            <button type="submit" class="btn login-submit">Entrar</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="src/js/auth.js"></script>
</body>
</html>
